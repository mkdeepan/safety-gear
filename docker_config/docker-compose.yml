version: '2'

services:
  safety_gear_db:
    image: mysql:8
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: safety_gear_db
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  safety_gear:
    depends_on:
      - safety_gear_db
    image: wordpress:php8.0
    container_name: safety_gear
    ports:
      - "80:80"
    restart: always
    links:
      - safety_gear_db:mysql
    volumes:
      - ../safety-gear/public_html:/var/www/html

volumes:
  db_data:
